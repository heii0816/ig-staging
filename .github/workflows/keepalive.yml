name: Keep Alive

on:
  schedule:
    - cron: '0 10 * * 1'   # 每週一早上 10:00 UTC（台北時間 18:00）
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Update keepalive timestamp
        run: |
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > keepalive.txt
          git config user.name  "ig-scheduler[bot]"
          git config user.email "ig-scheduler[bot]@users.noreply.github.com"
          git add keepalive.txt
          git commit -m "⏰ keepalive [skip ci]"
          git push
