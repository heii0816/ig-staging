name: IG Scheduler

on:
  workflow_dispatch:           # 手動觸發
  push:
    paths:
      - 'schedule.json'        # 每次排程新貼文推上來就刷新 token

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Refresh IG Token
        id: refresh
        run: |
          RESPONSE=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${{ secrets.IG_ACCESS_TOKEN }}")
          NEW_TOKEN=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token',''))" 2>/dev/null || echo "")
          if [ -n "$NEW_TOKEN" ] && [ "$NEW_TOKEN" != "None" ]; then
            echo "::add-mask::$NEW_TOKEN"
            echo "token=$NEW_TOKEN" >> $GITHUB_OUTPUT
            echo "refreshed=true" >> $GITHUB_OUTPUT
          else
            echo "token=${{ secrets.IG_ACCESS_TOKEN }}" >> $GITHUB_OUTPUT
            echo "refreshed=false" >> $GITHUB_OUTPUT
          fi

      - name: Update Token Secret
        if: steps.refresh.outputs.refreshed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set IG_ACCESS_TOKEN --body "${{ steps.refresh.outputs.token }}" --repo ${{ github.repository }}

      - name: Sync Token to Cloudflare KV
        run: |
          curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/storage/kv/namespaces/${{ secrets.CF_KV_NAMESPACE_ID }}/values/ig_access_token" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: text/plain" \
            --data "${{ steps.refresh.outputs.token }}" | python3 -c "import sys,json; d=json.load(sys.stdin); print('✓ CF KV 同步成功' if d.get('success') else f'✗ 同步失敗: {d}')"
